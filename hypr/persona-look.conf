# Persona look for classic hyprland.conf. Add:  source = ~/.config/hypr/persona-look.conf
general {
    gaps_in = 3
    gaps_out = 8
    border_size = 3
    col.active_border = rgba(e60012ff) rgba(e60012ff) rgba(f4f4f4ff) 135deg
    col.inactive_border = rgba(1a1a1aee)
}
decoration {
    rounding = 0
    dim_inactive = true
    dim_strength = 0.12
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.3
        noise = 0.02
    }
    shadow {
        enabled = true
        range = 22
        render_power = 2
        color = rgba(e6001288)
        color_inactive = rgba(00000066)
    }
}
exec-once = caelestia shell -d
exec-once = qs -c persona-bar -n -d
